<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <title>Ordlyd</title>
    <style>
      /* To eksplisitte temaer. Mørk modus følger anerkjent praksis:
         ingen ren svart/hvit, lysere flate = høyere elevasjon, dempet aksent. */
      :root {
        --bg: #f8fafc; --card: #ffffff; --fg: #1a2330; --muted: #5a6b7d;
        --line: #e2e8f0; --accent: #2563eb; --accent-fg: #ffffff;
        --off: #cbd5e1; --hover: #f1f5f9;
      }
      :root.dark {
        --bg: #161b22; --card: #1c2128; --fg: #e6edf3; --muted: #a3aeb9;
        --line: #3d444d; --accent: #4493f8; --accent-fg: #0d1117;
        --off: #4d5560; --hover: #262c36;
      }
      * { box-sizing: border-box; }
      body {
        font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 12px;
        width: 288px; background: var(--bg); color: var(--fg);
      }
      h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

      /* Hovedbryter framhevet i eget kort */
      .master {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 10px 12px; margin-bottom: 10px;
      }

      details {
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        margin-bottom: 8px; overflow: hidden;
      }
      summary {
        cursor: pointer; padding: 10px 12px; font-weight: 600;
        display: flex; align-items: center; gap: 8px; list-style: none;
      }
      summary::-webkit-details-marker { display: none; }
      summary:hover { background: var(--hover); }
      summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .chev { margin-left: auto; color: var(--muted); transition: transform 0.15s; }
      details[open] .chev { transform: rotate(90deg); }
      .group { padding: 0 12px 6px; }

      .row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 8px 0; border-top: 1px solid var(--line);
      }
      .group .row:first-child { border-top: none; }
      label { user-select: none; }
      .muted { color: var(--muted); font-size: 12px; }
      input[type="range"] { width: 110px; accent-color: var(--accent); }

      /* Av/på-bryter */
      .switch { position: relative; width: 40px; height: 22px; flex: none; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0; background: var(--off); border-radius: 999px;
        transition: background 0.15s; cursor: pointer;
      }
      .slider::before {
        content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
        background: #ffffff; border-radius: 50%; transition: transform 0.15s;
        box-shadow: 0 1px 2px rgb(0 0 0 / 30%);
      }
      .switch input:checked + .slider { background: var(--accent); }
      .switch input:checked + .slider::before { transform: translateX(18px); }
      .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Temavelger */
      .seg { display: flex; gap: 4px; }
      .seg button {
        font: 12px/1 system-ui, sans-serif; padding: 6px 10px; cursor: pointer;
        border: 1px solid var(--line); background: var(--card); color: inherit;
        border-radius: 999px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
      }
      #status { margin-top: 6px; text-align: center; }

      /* ---------- Lisens ---------- */
      .lic { display: flex; flex-direction: column; gap: 8px; }
      .lic label { font-weight: 600; font-size: 12px; }
      .lic input[type="text"] {
        width: 100%; font: 14px/1.3 system-ui, sans-serif; padding: 8px 10px;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--bg); color: inherit;
      }
      /* Koden er sifre: brede mellomrom og stor skrift gjør den lett å lese av
         for en dyslektiker, og feltet viser den alltid — ingen prikker. */
      .lic input#kode {
        font: 600 18px/1.3 ui-monospace, Consolas, monospace;
        letter-spacing: .18em; text-align: center;
      }
      .lic .feil { color: #b3261e; font-size: 12px; }
      .lic .ok { color: #1c6647; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        .lic .feil { color: #f2b8b5; }
        .lic .ok { color: #6fc79b; }
      }
      .btn {
        font: 600 13px/1 system-ui, sans-serif; padding: 9px 14px; cursor: pointer;
        border-radius: 8px; border: 1px solid var(--accent);
        background: var(--accent); color: var(--accent-fg);
      }
      .btn.sekundaer { background: var(--card); color: inherit; border-color: var(--line); }
      .btn:disabled { opacity: .6; cursor: default; }
      .licstate { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .badge {
        font: 600 10px/1 ui-monospace, Consolas, monospace; letter-spacing: .08em;
        text-transform: uppercase; padding: 3px 6px; border-radius: 4px;
      }
      .badge.aktiv { background: #dcebe3; color: #1c6647; }
      .badge.varsel { background: #f2e8d2; color: #8a5f08; }
      .badge.degradert { background: #f2dedc; color: #97302a; }
      @media (prefers-color-scheme: dark) {
        .badge.aktiv { background: #143024; color: #6fc79b; }
        .badge.varsel { background: #33280f; color: #d9ad55; }
        .badge.degradert { background: #371917; color: #e8938c; }
      }
      .hidden { display: none !important; }

      /* Logoen erstatter tekstoverskriften. Høyden er satt, bredden følger
         med, så et ordmerke i annet format ikke sprenger popupen. */
      .logo {
        display: block; height: 30px; width: auto; max-width: 100%;
        margin: 2px 0 12px;
      }
    </style>
  </head>
  <body>
    <h1 id="tittel"><img class="logo" id="logo" src="brand/logo.png" alt="Ordlyd" /></h1>

    <!-- Innlogging: vises bare når utvidelsen ikke er aktivert -->
    <div class="card lic hidden" id="loginCard">
      <div><strong>Aktiver Ordlyd</strong></div>
      <div class="muted" style="font-size: 12px">
        Skriv inn e-posten din og lisenskoden du har fått. Du gjør dette bare én gang på denne maskinen.
      </div>
      <div>
        <label for="epost">E-post</label>
        <input type="text" id="epost" inputmode="email" autocomplete="username" spellcheck="false" placeholder="navn@skole.no" />
      </div>
      <div>
        <label for="kode">Lisenskode</label>
        <input type="text" id="kode" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" placeholder="123 4567" maxlength="9" />
      </div>
      <div id="loginFeil" class="feil"></div>
      <button class="btn" id="loginBtn">Aktiver</button>
    </div>

    <!-- Lisensstatus: vises når aktivert -->
    <div class="card lic hidden" id="licCard">
      <div class="licstate">
        <span class="badge" id="licBadge"></span>
        <span class="muted" id="licInfo" style="font-size: 12px"></span>
      </div>
      <div id="licVarsel" class="muted" style="font-size: 12px"></div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button class="btn sekundaer" id="sjekkBtn">Sjekk lisensen nå</button>
        <button class="btn sekundaer" id="omBtn">Om Ordlyd</button>
        <button class="btn sekundaer" id="loggUtBtn">Logg ut</button>
      </div>
    </div>

    <div class="master" id="masterCard">
      <label for="enabled"><strong>Aktivert</strong><br /><span class="muted">Slår av alt under</span></label>
      <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
    </div>

    <details>
      <summary>🔈 Lesing og tale <span class="chev">›</span></summary>
      <div class="group">
        <div class="row">
          <label for="rate">Hastighet<br /><span class="muted" id="rateVal">1.0×</span></label>
          <input type="range" id="rate" min="0.5" max="2" step="0.1" />
        </div>
        <div class="row">
          <label for="echoLetters">Hør bokstaver<br /><span class="muted">«hå» når du taster H</span></label>
          <label class="switch"><input type="checkbox" id="echoLetters" /><span class="slider"></span></label>
        </div>
        <div class="row">
          <label for="echoWords">Hør ord<br /><span class="muted">Ordet leses ved mellomrom</span></label>
          <label class="switch"><input type="checkbox" id="echoWords" /><span class="slider"></span></label>
        </div>
        <div class="row">
          <label for="echoSentences">Hør setninger<br /><span class="muted">Setningen leses ved punktum</span></label>
          <label class="switch"><input type="checkbox" id="echoSentences" /><span class="slider"></span></label>
        </div>
      </div>
    </details>

    <details>
      <summary>✍️ Skrivehjelp <span class="chev">›</span></summary>
      <div class="group">
        <div class="row">
          <label for="prediction">Ordforslag<br /><span class="muted">Forslag mens du skriver</span></label>
          <label class="switch"><input type="checkbox" id="prediction" /><span class="slider"></span></label>
        </div>
        <div class="row">
          <label for="spellcheck">Stavekontroll<br /><span class="muted">«Mente du …?» ved skrivefeil</span></label>
          <label class="switch"><input type="checkbox" id="spellcheck" /><span class="slider"></span></label>
        </div>
      </div>
    </details>

    <details>
      <summary>📖 Ordbok og visning <span class="chev">›</span></summary>
      <div class="group">
        <div class="row">
          <label for="dictionaryBox">Ordbok-boks<br /><span class="muted">Søkeboks på siden. 📖 ved markert ord er alltid på</span></label>
          <label class="switch"><input type="checkbox" id="dictionaryBox" /><span class="slider"></span></label>
        </div>
        <div class="row">
          <label>Utseende<br /><span class="muted">Lys eller mørk visning</span></label>
          <div class="seg" role="group" aria-label="Utseende">
            <button id="themeStandard" aria-pressed="true">Standard</button>
            <button id="themeDark" aria-pressed="false">Mørk</button>
          </div>
        </div>
      </div>
    </details>

    <div class="muted" id="status">Marker tekst på en nettside og trykk «Les opp».</div>

    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
